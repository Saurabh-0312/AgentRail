[package]
name = "agentrail-token-activity"
version = "0.1.0"
edition = "2021"
description = "SPL Token activity on one delegated token account on Solana devnet, attributed to the signing authority"
license = "MIT"
repository = "https://github.com/Saurabh-0312/AgentRail"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
substreams = "0.7"
substreams-solana = "0.15"
prost = "0.13"
prost-types = "0.13"
bs58 = "0.5"

[workspace]

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
