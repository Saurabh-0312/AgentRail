# Base Sepolia: EvmMandate. Permissions and every authorized spend for The Graph's x402 gateway.
#
# ⚠️ 0x68822ce9… is EvmMandate on BASE SEPOLIA (and Hedera). The same address is AgentRailRegistry on
# Sepolia. This manifest loads the EvmMandate ABI; see EVENTS.md.
specVersion: 1.3.0
description: AgentRail EvmMandate on Base Sepolia (permissions and authorized spends), in the shared AgentRail schema
repository: https://github.com/Saurabh-0312/AgentRail
indexerHints:
  prune: auto
schema:
  file: ../schema.graphql
dataSources:
  - kind: ethereum
    name: EvmMandate
    network: base-sepolia
    source:
      address: "0x68822ce9109D9d71e99b07703cF6c851D0229AA9"
      abi: EvmMandate
      startBlock: 46598029
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Mandate
        - MandateKey
        - Permission
        - Action
      abis:
        - name: EvmMandate
          file: ../abis/EvmMandate.json
      eventHandlers:
        - event: MandateCreated(indexed bytes32,indexed address,indexed address,bytes32,uint64)
          handler: handleMandateCreated
        - event: PermissionAdded(indexed bytes32,indexed address,uint256,uint256)
          handler: handlePermissionAdded
        - event: PermissionRemoved(indexed bytes32,indexed address)
          handler: handlePermissionRemoved
        - event: MandateRevoked(indexed bytes32)
          handler: handleMandateRevoked
        - event: SpendAuthorized(indexed bytes32,indexed address,uint256,uint256,bytes32)
          handler: handleSpendAuthorized
        - event: PaymentExecuted(indexed bytes32,indexed address,indexed address,uint256,uint256)
          handler: handlePaymentExecuted
      file: ./src/base/mandate.ts
