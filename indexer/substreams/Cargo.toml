[package]
name = "agentrail-substreams"
version = "0.1.0"
edition = "2021"
description = "AgentRail agent-mandate activity on Solana: execute_payment and verify, successes and reverts, decoded from instruction data and transaction meta"
license = "MIT"
repository = "https://github.com/Saurabh-0312/AgentRail"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
substreams = "0.7"
substreams-solana = "0.15"
prost = "0.13"
prost-types = "0.13"
bs58 = "0.5"
hex = "0.4"

# Not a member of the Anchor workspace at the repo root: different target, different toolchain rules.
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
