name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: foundry
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
      - run: forge test -vvv

  workspace:
    name: yarn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @agentrail/data-feed test
      - run: yarn workspace @agentrail/sdk test
      - run: yarn workspace @agentrail/query test
      - run: yarn workspace @agentrail/agent test
      - run: yarn workspace @agentrail/mcp-server test
      - run: yarn workspace @agentrail/web test

  subgraph:
    name: matchstick
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer/subgraph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
        working-directory: .
      - run: yarn codegen
      - run: yarn build
      # matchstick resolves the AssemblyScript compiler, graph-ts and its own library relative to the
      # package's node_modules, but a yarn workspace hoists them to the repo root (and the package
      # keeps a local node_modules/.bin, so the folder itself cannot be a symlink)
      - run: |
          mkdir -p node_modules
          for p in assemblyscript @graphprotocol matchstick-as; do
            [ -e "node_modules/$p" ] || ln -s "$GITHUB_WORKSPACE/node_modules/$p" "node_modules/$p"
          done
          ls -la node_modules/assemblyscript/bin/asc node_modules/@graphprotocol/graph-ts/global/global.ts
      - run: yarn test

  substreams:
    name: substreams decoder
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer/substreams
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo test
        working-directory: indexer/substreams-token-activity
